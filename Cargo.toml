[package]
name = "rstop"
version = "0.1.0"
edition = "2024"
description = "Interactive Linux terminal system monitor inspired by htop and btop"
license = "MIT"
keywords = ["top", "htop", "btop", "system-monitor", "tui"]
categories = ["command-line-utilities"]
exclude = ["docs/", ".agents/", ".claude/", "skills-lock.json"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
libc = "0.2"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
